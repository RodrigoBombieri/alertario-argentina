services:
  api:
    build:
      context: ../../..
      dockerfile: backend/src/AlertaRio.Api/Dockerfile
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ColdStart__Enabled: "true"
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  worker:
    build:
      context: ../../..
      dockerfile: backend/src/AlertaRio.Worker/Dockerfile
    env_file: .env
    environment:
      DOTNET_ENVIRONMENT: Production
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  caddy:
    image: caddy:2.11.6-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
